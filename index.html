<style>
  /* ========== 基础与配色 ========== */
  :root {
    --bg-card: #ffffff;
    --bg-page: #f2f3f5;
    --text: #1a1a1a;
    --text-sub: #6b6b70;
    --text-weak: #9a9aa0;
    --line: #ededf0;
    --brand: #ff6b00;
    --brand-2: #ffa033;
    --blue: #1e7bf5;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
                 'Microsoft YaHei', 'Segoe UI', sans-serif;
    color: var(--text);
    background: var(--bg-page);
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 40px;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部渐变色带：蓝灰自上而下淡出到页面底色，180deg 保证左右无色差接缝 */
  .top-bg {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 380px;
    background: linear-gradient(180deg, #6b90bc 0%, #86a4c6 22%, #b9c6d8 50%, #dde0e6 74%, var(--bg-page) 100%);
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 620px;
    margin: 0 auto;
    padding: 96px 16px 0;
  }

  /* ========== 卡片 ========== */
  .card {
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(20, 30, 45, 0.05);
    margin-bottom: 12px;
    overflow: hidden;
  }

  /* ========== 品牌头部 ========== */
  .profile { padding: 20px 22px 22px; }

  .brand {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.2px;
    background: linear-gradient(92deg, var(--brand) 0%, var(--brand-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }

  .profile-meta {
    margin-top: 12px;
    font-size: 14px;
    color: var(--text-sub);
    line-height: 1.85;
  }

  .profile-meta a {
    color: var(--text-sub);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
  }

  .profile-meta a:hover {
    color: var(--brand);
    border-bottom-color: rgba(255, 107, 0, 0.35);
  }

  /* ========== 产品与服务 ========== */
  .section { padding: 20px 22px 22px; }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 18px;
  }

  .products {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 24px;
  }

  .product {
    display: block;
    text-decoration: none;
    color: inherit;
    border-radius: 8px;
    padding: 2px;
    transition: background .2s;
  }

  .product:hover { background: #f7f8fa; }

  /* 产品图标：直接使用 App 图标原图，自带圆角 */
  .product-icon {
    display: block;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    margin-bottom: 10px;
    object-fit: cover;
  }

  .product-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .product-desc {
    font-size: 12.5px;
    color: var(--text-weak);
    margin-top: 3px;
    line-height: 1.65;
    word-break: normal;
    overflow-wrap: break-word;
  }

  /* 产品链接单独一行，字号更小以便在窄栏内完整显示 */
  .product-url {
    display: block;
    font-size: 11.5px;
    letter-spacing: -0.1px;
  }

  /* ========== 联系企业 ========== */
  .contact-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 17px 22px;
    background: none;
    border: 0;
    font: inherit;
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    transition: background .2s;
  }

  .contact-row:hover { background: #f7f8fa; }

  .chevron {
    width: 7px;
    height: 7px;
    border-top: 1.6px solid #c2c2c8;
    border-right: 1.6px solid #c2c2c8;
    transform: rotate(45deg);
    flex: none;
    margin-left: 12px;
  }

  /* ========== 页脚 ========== */
  .footer {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: var(--text-weak);
    line-height: 1.9;
  }

  .footer a { color: var(--text-weak); text-decoration: none; }
  .footer a:hover { color: var(--text-sub); }

  /* ========== 弹窗 ========== */
  .mask {
    position: fixed;
    inset: 0;
    background: rgba(30, 32, 38, 0.42);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: opacity .22s ease, visibility .22s;
  }

  .mask.show { opacity: 1; visibility: visible; }

  .dialog {
    position: relative;
    width: 100%;
    max-width: 380px;
    max-height: 88vh;
    overflow-y: auto;
    background: #fff;
    border-radius: 12px;
    padding: 30px 28px 24px;
    text-align: center;
    box-shadow: 0 18px 48px rgba(20, 30, 45, 0.18);
    transform: translateY(10px) scale(.98);
    transition: transform .22s ease;
  }

  .mask.show .dialog { transform: none; }

  .dlg-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    border: 0;
    background: none;
    cursor: pointer;
    color: #b8b8be;
    font-size: 20px;
    line-height: 1;
    border-radius: 6px;
    transition: color .2s, background .2s;
  }

  .dlg-close:hover { color: #6b6b70; background: #f4f5f7; }

  .dlg-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .dlg-sub {
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 8px;
  }

  .dlg-avatar {
    width: 64px;
    height: 64px;
    border-radius: 9px;
    object-fit: cover;
    display: block;
    margin: 24px auto 12px;
    background: #d7dce4;
  }

  .dlg-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .dlg-org {
    font-size: 13.5px;
    color: #f5822a;
    margin-top: 2px;
  }

  .btn-primary {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 11px 0;
    background: var(--blue);
    color: #fff;
    font-size: 15px;
    text-align: center;
    text-decoration: none;
    border-radius: 6px;
    transition: background .2s;
  }

  .btn-primary:hover { background: #1869d8; }

  .dlg-divider {
    height: 1px;
    background: var(--line);
    margin: 22px 0 18px;
  }

  .qr-tip {
    font-size: 12.5px;
    color: var(--text-weak);
  }

  .qr {
    width: 180px;
    height: 180px;
    display: block;
    margin: 14px auto 0;
    border-radius: 4px;
  }

  .wecom-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin-top: 10px;
    font-size: 12px;
    color: #b4b4ba;
  }

  .wecom-brand svg { width: 14px; height: 14px; fill: #c8c8ce; }

  /* ========== 移动端 ========== */
  @media (max-width: 520px) {
    .wrap { padding-top: 84px; }
    .products { gap: 16px; }
    .product-icon { width: 38px; height: 38px; }
    .product-name { font-size: 14px; }
    .product-desc { font-size: 12px; }
    .profile { padding: 18px; }
    .section { padding: 18px; }
    .contact-row { padding: 16px 18px; }
    .dialog { padding: 28px 20px 22px; }
    .qr { width: 160px; height: 160px; }
  }
</style>
</head>
<body>
<div class="top-bg"></div>

<div class="wrap">

  <!-- 品牌头部 -->
  <section class="card profile">
    <div class="brand">@QB工作室</div>
    <div class="profile-meta">
      github:<a href="https://github.com/LAIXINQUAN" target="_blank" rel="noopener">https://github.com/LAIXINQUAN</a><br>
      有事请联系<a href="mailto:laixinqb@foxmail.com">laixinqb@foxmail.com</a>
    </div>
  </section>

  <!-- 产品与服务 -->
  <section class="card section">
    <div class="section-title">产品与服务</div>
    <div class="products">
      <a class="product" href="https://laixinquan.github.io/music-search-downloader/">
        <img class="product-icon" src="assets/qb-music.png" alt="QB音乐 图标" width="42" height="42" loading="lazy">
        <div class="product-name">QB音乐</div>
        <div class="product-desc">开源，免费<span class="product-url">laixinquan.github.io/music-search-downloader</span></div>
      </a>

      <a class="product" href="https://laixinquan.github.io/jump/">
        <img class="product-icon" src="assets/jump.png" alt="公益跳转站 图标" width="42" height="42" loading="lazy">
        <div class="product-name">公益跳转站</div>
        <div class="product-desc">开源-免费-稳定，咨询请私信</div>
      </a>
    </div>
  </section>

  <!-- 联系企业 -->
  <section class="card">
    <button class="contact-row" id="openContact" type="button" aria-haspopup="dialog">
      <span>联系企业</span>
      <i class="chevron" aria-hidden="true"></i>
    </button>
  </section>

  <div class="footer">
    © 2026 QB工作室 · 开源免费<br>
    <a href="https://github.com/LAIXINQUAN" target="_blank" rel="noopener">GitHub</a>
  </div>

</div>

<!-- 联系企业弹窗 -->
<div class="mask" id="contactMask" role="dialog" aria-modal="true" aria-labelledby="contactTitle">
  <div class="dialog">
    <button class="dlg-close" id="closeContact" type="button" aria-label="关闭">&times;</button>

    <h2 class="dlg-title" id="contactTitle">联系企业</h2>
    <p class="dlg-sub">添加成员为联系人，与我们联系</p>

    <img class="dlg-avatar" src="assets/contact-avatar.png" alt="赖鑫权 头像" width="64" height="64">
    <div class="dlg-name">赖鑫权</div>
    <div class="dlg-org">@QB工作室</div>

    <a class="btn-primary" href="mailto:laixinqb@foxmail.com?subject=%E6%9D%A5%E8%87%AA%20QB%E5%B7%A5%E4%BD%9C%E5%AE%A4%E4%B8%BB%E9%A1%B5">发消息</a>

    <div class="dlg-divider"></div>

    <p class="qr-tip">扫描二维码，添加我的企业微信</p>
    <img class="qr" src="assets/wecom-qr.png" alt="企业微信二维码，扫码添加 QB工作室" width="180" height="180">
    <div class="wecom-brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.4C6.9 3.4 2.8 6.7 2.8 10.8c0 2.3 1.3 4.4 3.4 5.8l-.8 2.7 3-1.5c1 .3 2.2.4 3.4.4 5.1 0 9.2-3.3 9.2-7.4S17.1 3.4 12 3.4z"/>
      </svg>
      企业微信
    </div>
  </div>
</div>

<script>
  /* 联系企业弹窗：打开、关闭、点击遮罩关闭、ESC 关闭 */
  (function () {
    var mask = document.getElementById('contactMask');
    var openBtn = document.getElementById('openContact');
    var closeBtn = document.getElementById('closeContact');

    /**
     * 打开联系企业弹窗并锁定页面滚动
     */
    function openDialog() {
      mask.classList.add('show');
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }

    /**
     * 关闭联系企业弹窗并恢复页面滚动
     */
    function closeDialog() {
      mask.classList.remove('show');
      document.body.style.overflow = '';
      openBtn.focus();
    }

    openBtn.addEventListener('click', openDialog);
    closeBtn.addEventListener('click', closeDialog);

    /* 点击遮罩空白处关闭 */
    mask.addEventListener('click', function (e) {
      if (e.target === mask) closeDialog();
    });

    /* ESC 键关闭 */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && mask.classList.contains('show')) closeDialog();
    });
  })();
</script>
</body>
</html>
